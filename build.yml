

name: Build CupertinoTV

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Extract project archive

        run: |

          mkdir extracted

          unzip -q SharpAppleLauncher.zip -d extracted

          echo "Archive contents:"

          find extracted -maxdepth 4 -type f | head -100

      - name: Set up Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'

      - name: Build APK

        run: |

          WRAPPER=$(find extracted -type f -name gradlew | head -1)

          if [ -z "$WRAPPER" ]; then

            echo "No Gradle wrapper found in ZIP."

            exit 1

          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: CupertinoTV-APK

          path: extracted/**/build/outputs/apk/debug/*.apk